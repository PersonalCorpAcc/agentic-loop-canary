# The canary's profile. Everything the loop does here is projected from this file.
#
# A branch chain on purpose: `trunk` is the shape this loop has run in production for
# months, and the chain is the one nothing has ever executed. Work is cut from `main`,
# opens against `dev`, and is promoted dev → test → main, closing its issue at `main`.
version: 1
name: agentic-loop-canary

runners:
  agent: [ubuntu-latest]
  slim: [ubuntu-latest]
  ci: [ubuntu-latest]

# The engine and the model the agents run on (FR-075 to FR-077).
#
# Claude Code, which is a client-shaped choice: no gateway, no Plain Concepts host, and the
# credential is the adopter's own key under the variable the framework validates. Under
# `opencode` this block named a gateway this repository holds no key for, so every agent
# route died at the credential; that was the last thing standing between here and a real
# cycle.
#
# Sonnet 5 is the default rather than Opus 5. The first real run cost $1.20 for a
# hello-world, almost all of it cache reads, and the canary exists to prove the cycle rather
# than the model. Opus 5 is $5/$25 per MTok, Sonnet 5 $2/$10, Haiku 4.5 $1/$5, so this is
# roughly 60% off and the routes that write and review code keep a strong model.
#
# `models` overrides the model for one route (FR-077). Only release is overridden, and only
# because it is the one route with no judgement in it: read a git log, categorise commits by
# conventional-commit prefix, write notes, stop. A deterministic job does the tagging and the
# publishing, its input is bounded, and a wrong answer is visible in the notes.
#
# Triage is deliberately *not* on Haiku, though it looks like the obvious candidate. It runs
# ten checks including a security-risk scan and a danger-level assessment, and its verdict
# decides whether work starts at all; it also compares the issue against every open issue for
# duplicates, which grows, and Haiku 4.5 holds 200K of context against Sonnet 5's 1M.
llm:
  engine: claude
  model: claude-sonnet-5
  secret: ANTHROPIC_API_KEY
  models:
    release: claude-haiku-4-5

# The App this loop acts as. `appLogin` must be the App's own bot login, which GitHub
# derives from the App's name: an App named "Agentic Loop Canary" logs in as
# `agentic-loop-canary[bot]`.
bot:
  appLogin: agentic-loop-canary[bot]
  appIdSecret: BOT_APP_ID
  keySecret: BOT_PRIVATE_KEY

# Neither is needed to prove the chain, and each is a host to reach and a secret to hold.
memory:
  enabled: false
codegraph:
  enabled: false

stack: [go]
projects:
  - path: .
    stack: go
    label: app
    verify: go build ./... && go test ./...

branching:
  strategy: branch-chain
  cutFrom: main
  chain: [dev, test, main]
  # Two issues may be implemented at once. The shipped default is 1, which is what the
  # inherited loop did: one global group, every implement waiting for the one before it. Two
  # keys the group per issue instead, so duplicate events for one issue still collapse while
  # different issues proceed in parallel.
  #
  # A concurrency group cannot express "at most N", so this selects the shape rather than a
  # limit: above 1 the ceiling is the runner fleet, not this number.
  concurrentImplements: 2
  mergeMethod: rebase
  closeIssueOn: main
  branchNaming: agent/{issue}-{run}
  # Short, because a canary that soaked for a day would prove one promotion a day.
  soak:
    test: 5m
    main: 5m
  changelogOn: [main]

  # Unattended merge into every stage, so the whole promotion runs without a person and can
  # be watched doing it. Both halves still have to agree before anything merges itself: the
  # mode must not be `off`, and the pull request's base must be named here.
  #
  # This is a canary setting, not a recommendation. The shipped default is `off`, and an
  # adopter should start there and open one stage at a time. Naming `main` means a change can
  # travel from an issue to the default branch with nobody in the path -- which is the thing
  # this repository exists to demonstrate, and the thing a real repository should decide
  # deliberately rather than inherit.
  #
  # The soak still applies between stages: `targets` says a merge may happen unattended, not
  # that it happens immediately. A promotion that has not soaked is still refused, and a
  # revert on an earlier stage still stops the change travelling (T126).
  #
  # `risk-based` is in the schema and refused at projection (T134): the choice today is
  # `off` or `always`.
  autoMerge:
    mode: always
    targets: [dev, test, main]

changelog:
  path: CHANGELOG.json

ci:
  template: app-ci-go
  workflowName: CI

release:
  versionSource: git-tag

audit:
  cronSlot: 4

# Every clock, off (FR-081).
#
# Not a hand edit to the installed router any more: that is what this repository has been
# carrying since 15/09, and every `add --force` restored the schedule without saying so --
# caught three times, and the time it was not caught is the 147 failed runs of 15-16/09.
# Five clocks are about seventy-four router runs a day, roughly 9,000 billable minutes a
# month against a 2,000-minute allowance (T198).
#
# Off is not "never": each route is still reachable by `workflow_dispatch`, which is how the
# whole chain was proven on 17/09. Turn them on one at a time, with somebody watching.
crons:
  audit: off
  auditClose: off
  cleanupArtifacts: off
  reconcileBotPrRuns: off
  promote: off
  syncStages: off

constitution:
  entry: AGENTS.md
  docs: [ARCHITECTURE.md]
