# Managed by @plainconceptsplatform/workflows@0.5.1. Source: loops/actions/identify-gate-subject/action.yml. Profile digest: bac61e5585d7. Update with workflows update --force; consumer edits may be overwritten.
name: Identify gate subject
description: Confirm the pull request is one we authored, resolve the issue it closes, and check that issue carries the required label.
inputs:
  token:
    description: GitHub token with issues and pull-requests read access.
    required: true
  pr-number:
    description: Pull request number to gate.
    required: true
  ci-conclusion:
    description: Conclusion reported by the CI run that triggered this gate. If empty, fetches from the PR's latest CI run.
    required: false
    default: ''
  linked-issue:
    description: Issue the pull request closes, when the router already resolved it.
    required: false
    default: ''
  stage-labels:
    description: >-
      `stage=label` pairs, comma separated: the label an issue must carry for a pull request
      targeting that stage. Selected by the pull request's own base, because a promotion into
      the third stage and a fresh change into the first are both gated here and they are not
      the same thing. Empty under a strategy with no chain, where require-label answers.
    required: false
    default: ''
  require-label:
    description: Label the closing issue must carry. Empty disables the check.
    required: false
    default: ''
outputs:
  found:
    description: Whether a valid gate subject was found.
    value: ${{ steps.identify.outputs.found }}
  why-not:
    description: >
      One sentence saying which condition this pull request failed, when it failed one.
      Empty when a subject was found. The alternative is a caller listing every condition it
      might have been, which for a pull request this loop did open reads as a denial that it
      did (FR-084).
    value: ${{ steps.identify.outputs.why-not }}
  pr:
    description: Pull request number.
    value: ${{ steps.identify.outputs.pr }}
  issue:
    description: Issue number the pull request closes.
    value: ${{ steps.identify.outputs.issue }}
  conclusion:
    description: CI conclusion, passed through unchanged or fetched from latest CI run.
    value: ${{ steps.identify.outputs.conclusion }}
  base:
    description: >-
      The branch this pull request opens against. Read from the forge rather than taken from
      the profile: a first-stage pull request and a promotion into a later stage are both
      gated here, and only the pull request knows which of the strategy's branches it is
      against (FR-027).
    value: ${{ steps.identify.outputs.base }}
  run-id:
    description: CI run ID when fetched.
    value: ${{ steps.identify.outputs.run-id }}
runs:
  using: composite
  steps:
    - name: Identify pull request and closing issue
      id: identify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ inputs.pr-number }}
        CONCLUSION: ${{ inputs.ci-conclusion }}
        LINKED_ISSUE: ${{ inputs.linked-issue }}
        REQUIRE_LABEL: ${{ inputs.require-label }}
        STAGE_LABELS: ${{ inputs.stage-labels }}
      run: |
        set -euo pipefail

        none() {
          {
            echo "found=false"
            echo "why-not=$1"
          } >>"$GITHUB_OUTPUT"
          echo "$1"
          exit 0
        }

        pr="$(gh pr view "$PR_NUMBER" --repo "$REPO" \
          --json state,author,body,baseRefName)"

        [ "$(jq -r '.state' <<<"$pr")" = "OPEN" ] || none "PR #$PR_NUMBER is not open"

        # Use GitHub's bot flag because App login formats differ across APIs.
        if [ "$(jq -r '.author.is_bot' <<<"$pr")" != "true" ]; then
          none "PR #$PR_NUMBER was authored by $(jq -r '.author.login' <<<"$pr"), a human."
        fi

        echo "base=$(jq -r '.baseRefName // ""' <<<"$pr")" >> "$GITHUB_OUTPUT"

        issue="$LINKED_ISSUE"

        # The classifier resolved this once already and passed it down. When it did not --
        # a dispatch, a label event -- the same rule answers here rather than a second
        # spelling of it: marker first, then the forge's link, then a keyword (FR-030).
        if [ -z "$issue" ]; then
          # shellcheck source=../resolve-pr-issue/resolve-pr-issue.sh
          . "${GITHUB_ACTION_PATH}/../resolve-pr-issue/resolve-pr-issue.sh"
          issue="$(pr_issue "$PR_NUMBER")"
        fi

        [ -n "$issue" ] || none "PR #$PR_NUMBER belongs to no issue, so there is nothing to assess it against. A pull request this loop opens without one -- a stage synchronisation, say -- is a person's to merge."

        # Which label this pull request's base demands. The map wins where it has an entry,
        # because it knows the difference between the first stage and the fourth; the single
        # input answers when there is no chain at all, which is every trunk repository
        # (FR-030).
        base="$(jq -r '.baseRefName // ""' <<<"$pr")"
        required="$REQUIRE_LABEL"
        if [ -n "${STAGE_LABELS:-}" ]; then
          required=""
          while IFS= read -r pair; do
            [ -n "$pair" ] || continue
            case "$pair" in
              "${base}="*) required="${pair#*=}" ;;
            esac
          done < <(printf '%s\n' "$STAGE_LABELS" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')

          if [ -z "$required" ]; then
            none "PR #$PR_NUMBER targets '$base', which is not a stage this loop promotes through"
          fi
        fi

        if [ -n "$required" ]; then
          labels="$(gh issue view "$issue" --repo "$REPO" --json labels \
            --jq '[.labels[].name]')"

          if ! jq -e --arg name "$required" 'index($name)' >/dev/null <<<"$labels"; then
            none "issue #$issue does not carry $required, which a pull request into '$base' requires (has: $(jq -r 'join(", ")' <<<"$labels"))"
          fi
        fi

        # Fetch CI conclusion if not provided (label-triggered runs)
        ci_conclusion="$CONCLUSION"
        ci_run_id=""
        if [ -z "$ci_conclusion" ]; then
          head_sha="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json headRefOid --jq '.headRefOid')"
          # Branch protection requires a check run by name, and a check run's name is a job's,
          # not a workflow's. Reading the same check here is what makes "CI passed" mean one
          # thing to the gate and to protection (FR-068). The check run names the workflow run
          # it belongs to only in its URL, so the run id is read from there.
          ci_run="$(gh api "repos/$REPO/commits/$head_sha/check-runs?per_page=100" \
            --jq '[.check_runs[] | select(.name == "CI")] | sort_by(.started_at) | last')"
          
          if [ -n "$ci_run" ] && [ "$ci_run" != "null" ]; then
            ci_conclusion="$(jq -r '.conclusion // "pending"' <<<"$ci_run")"
            ci_run_id="$(jq -r '.html_url' <<<"$ci_run" | sed -n 's#.*/actions/runs/\([0-9][0-9]*\)/.*#\1#p')"
            echo "::notice::Fetched CI status: $ci_conclusion (run $ci_run_id)"
          else
            ci_conclusion="unknown"
            echo "::warning::No CI run found for PR #$PR_NUMBER"
          fi
        fi

        {
          echo "found=true"
          echo "pr=$PR_NUMBER"
          echo "issue=$issue"
          echo "conclusion=$ci_conclusion"
          echo "run-id=$ci_run_id"
        } >> "$GITHUB_OUTPUT"

        echo "PR #$PR_NUMBER closes #$issue; CI concluded $ci_conclusion"
