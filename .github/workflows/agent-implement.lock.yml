name: "Agent: Implement Issue"
on:
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      attempts_so_far:
        default: "0"
        description: Failed implement runs already made for this issue. Parked when it reaches the cap.
        required: false
        type: string
      issue-number:
        description: Issue number to implement.
        required: true
        type: string
    outputs:
      created_pr_number:
        description: Number of the first created pull request
        value: ${{ jobs.safe_outputs.outputs.created_pr_number }}
      created_pr_url:
        description: URL of the first created pull request
        value: ${{ jobs.safe_outputs.outputs.created_pr_url }}
      push_commit_sha:
        description: SHA of the pushed commit
        value: ${{ jobs.safe_outputs.outputs.push_commit_sha }}
      push_commit_url:
        description: URL of the pushed commit
        value: ${{ jobs.safe_outputs.outputs.push_commit_url }}
    secrets:
      BOT_APP_ID:
        required: false
      BOT_PRIVATE_KEY:
        required: false
      CODEX_API_KEY:
        required: false
      COPILOT_GITHUB_TOKEN:
        required: false
      GH_AW_CI_TRIGGER_TOKEN:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: false

permissions: {}

concurrency:
  group: "gh-aw-agent-implement-${{ github.run_id }}"
  queue: max

run-name: "Agent: Implement Issue"

env:
  ATTEMPT_MARKER: "<!-- agent-implement-attempt -->"
  BASE_BRANCH: dev
  BRANCH_POINT: main
  GH_AW_ALLOWED_BOTS: agentic-loop-canary[bot],github-actions[bot]
  GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  IMPLEMENT_LABEL: implement
  IMPLEMENT_MARKER: "<!-- agent-implement -->"
  INCOMPLETE_COMMENT: "Automated implementation ran and ended without an outcome. The issue is released and flagged for review: a run that got this far and still failed will fail the same way again."
  ISSUE_CONTEXT_PATH: /tmp/gh-aw/agent/implementation-context.json
  LINT_FIX_COMMAND: golangci-lint run --fix
  MAX_ATTEMPTS: "5"
  PARK_AT_ATTEMPT: "4"
  PLAN_ARCHIVE_SKILL: plan-archive
  PLAN_EXPLORE_SKILL: plan-explore
  PLAN_IMPLEMENT_SKILL: plan-implement
  PLAN_PROPOSE_SKILL: plan-propose
  PLAN_RUN_COMMAND: plan-run
  PLAN_RUN_SKILL: plan-run
  PR_PENDING_LABEL: pr-pending
  REPO_RULES: Run gofmt over anything you change; a build that fails only on formatting wastes a whole run.
  REPO_VERIFY_SKILL: repo-verify
  RETRY_UNDER_MINUTES: "6"
  REVIEW_LABEL: review
  RTK_SHA256: 986f29704469b3d1051e2474105c6c75ab8b73651068dcd61612c1fb3938ad95
  RTK_VERSION: 0.44.1
  VERIFY_COMMANDS: go build ./... && go test ./...
  VERIFY_COMMANDS_SCOPED: golangci-lint run
  WORKING_LABEL: bot-working

