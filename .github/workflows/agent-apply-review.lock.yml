name: "Agent: Apply Review"
on:
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      linked-issue:
        description: Issue number the pull request closes. May be empty.
        required: false
        type: string
      pr-number:
        description: Pull request number to apply review feedback on.
        required: true
        type: string
    outputs:
      comment_id:
        description: ID of the first added comment
        value: ${{ jobs.safe_outputs.outputs.comment_id }}
      comment_url:
        description: URL of the first added comment
        value: ${{ jobs.safe_outputs.outputs.comment_url }}
      push_commit_sha:
        description: SHA of the pushed commit
        value: ${{ jobs.safe_outputs.outputs.push_commit_sha }}
      push_commit_url:
        description: URL of the pushed commit
        value: ${{ jobs.safe_outputs.outputs.push_commit_url }}
    secrets:
      BOT_APP_ID:
        required: false
      BOT_PRIVATE_KEY:
        required: false
      CODEX_API_KEY:
        required: false
      COPILOT_GITHUB_TOKEN:
        required: false
      GH_AW_CI_TRIGGER_TOKEN:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: false

permissions: {}

concurrency:
  group: "gh-aw-agent-apply-review-${{ github.run_id }}"
  queue: max

run-name: "Agent: Apply Review"

env:
  GH_AW_ALLOWED_BOTS: agentic-loop-canary[bot],github-actions[bot]
  GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  INCOMPLETE_COMMENT: Automated review feedback ended without an outcome. The issue remains for a retry.
  ISSUE_CONTEXT_PATH: /tmp/gh-aw/agent/issue-context.json
  LINT_FIX_COMMAND: golangci-lint run --fix
  PR_PENDING_LABEL: pr-pending
  REPO_RULES: Run gofmt over anything you change; a build that fails only on formatting wastes a whole run.
  REPO_VERIFY_COMMAND: repo-verify
  REVIEW_LABEL: review
  REVIEW_MARKER: "<!-- agent-apply-review -->"
  RTK_SHA256: 986f29704469b3d1051e2474105c6c75ab8b73651068dcd61612c1fb3938ad95
  RTK_VERSION: 0.44.1
  VERIFY_COMMANDS: go build ./... && go test ./...
  VERIFY_COMMANDS_SCOPED: golangci-lint run
  WORKING_LABEL: bot-working

jobs:
  activation:
    needs:
      - pre_activation
      - subject
    if: needs.pre_activation.outputs.activated == 'true' && (needs.subject.outputs.found == 'true')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      GH_AW_MAX_DAILY_AI_CREDITS: ${{ vars.GH_AW_DEFAULT_MAX_DAILY_AI_CREDITS || '5000' }}
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
    outputs:
      artifact_prefix: ${{ steps.artifact-prefix.outputs.prefix }}
      comment_id: ""
      comment_repo: ""
      daily_ai_credits_exceeded: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_exceeded == 'true' }}
      daily_ai_credits_guardrail_status: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_guardrail_status || '' }}
      daily_ai_credits_threshold: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_threshold || '' }}
      daily_ai_credits_total_effective_tokens: ${{ steps.daily-effective-workflow-guardrail.outputs.daily_ai_credits_total_effective_tokens || '' }}
      engine_id: ${{ steps.generate_aw_info.outputs.engine_id }}
      lockdown_check_failed: ${{ steps.generate_aw_info.outputs.lockdown_check_failed == 'true' }}
      model: ${{ steps.generate_aw_info.outputs.model }}
      oauth_token_check_failed: ${{ steps.check-oauth-tokens.outputs.oauth_token_check_failed == 'true' }}
      secret_verification_result: ${{ steps.validate-secret.outputs.verification_result }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      stale_lock_file_failed: ${{ steps.check-lock-file.outputs.stale_lock_file_failed == 'true' }}
      target_checkout_ref: ${{ steps.resolve-host-repo.outputs.target_checkout_ref }}
      target_ref: ${{ steps.resolve-host-repo.outputs.target_ref }}
      target_repo: ${{ steps.resolve-host-repo.outputs.target_repo }}
      target_repo_name: ${{ steps.resolve-host-repo.outputs.target_repo_name }}
    steps:
