      GH_AW_CALLER_WORKFLOW_ID: "${{ github.repository }}/agent-apply-review"
      GH_AW_EFFECTIVE_TOKENS: ${{ needs.agent.outputs.effective_tokens }}
      GH_AW_ENGINE_ID: "opencode"
      GH_AW_ENGINE_MODEL: "openai/glm-5-3"
      GH_AW_ENGINE_VERSION: "1.2.14"
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID: "agent-apply-review"
      GH_AW_WORKFLOW_NAME: "Agent: Apply Review"
