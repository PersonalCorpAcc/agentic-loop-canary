        run: |
          mkdir -p /tmp/gh-aw/aw-prompts
          cp -a "${RUNNER_TEMP}/gh-aw/aw-prompts/." /tmp/gh-aw/aw-prompts/
      - name: Upload activation artifact
        if: success() || failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact-prefix.outputs.prefix }}activation
          include-hidden-files: true
          path: |
            /tmp/gh-aw/aw_info.json
            /tmp/gh-aw/models.json
            /tmp/gh-aw/aw-prompts/prompt.txt
            /tmp/gh-aw/aw-prompts/prompt-template.txt
            /tmp/gh-aw/aw-prompts/prompt-import-tree.json
            /tmp/gh-aw/github_rate_limits.jsonl
            /tmp/gh-aw/base
            /tmp/gh-aw/.opencode/agents
            /tmp/gh-aw/.opencode/skills
          if-no-files-found: ignore
          retention-days: 1

  agent:
    needs:
      - activation
      - reserve
      - subject
    if: (needs.subject.outputs.found == 'true') && (needs.activation.outputs.daily_ai_credits_exceeded != 'true')
    runs-on: ubuntu-latest
    permissions: read-all
    concurrency:
      group: "gh-aw-opencode-agent-apply-review"
      queue: max
    timeout-minutes: 60
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_AW_ASSETS_ALLOWED_EXTS: ""
      GH_AW_ASSETS_BRANCH: ""
      GH_AW_ASSETS_MAX_SIZE_KB: 0
      GH_AW_ENGINE_VERSION: "1.2.14"
      GH_AW_MCP_LOG_DIR: /tmp/gh-aw/mcp-logs/safeoutputs
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_WORKFLOW_ID_SANITIZED: agentapplyreview
    outputs:
      ai_credits_rate_limit_error: ${{ steps.parse-mcp-gateway.outputs.ai_credits_rate_limit_error || 'false' }}
      aic: ${{ steps.parse-mcp-gateway.outputs.aic }}
      ambient_context: ${{ steps.parse-mcp-gateway.outputs.ambient_context }}
      artifact_prefix: ${{ needs.activation.outputs.artifact_prefix }}
      checkout_pr_success: ${{ steps.checkout-pr.outputs.checkout_pr_success || 'true' }}
      effective_tokens: ${{ steps.parse-mcp-gateway.outputs.effective_tokens }}
      has_patch: ${{ steps.collect_output.outputs.has_patch }}
      model: ${{ needs.activation.outputs.model }}
      output: ${{ steps.collect_output.outputs.output }}
      output_types: ${{ steps.collect_output.outputs.output_types }}
      setup-parent-span-id: ${{ steps.setup.outputs.parent-span-id || steps.setup.outputs.span-id }}
      setup-span-id: ${{ steps.setup.outputs.span-id }}
      setup-trace-id: ${{ steps.setup.outputs.trace-id }}
      unknown_model_ai_credits: ${{ steps.parse-mcp-gateway.outputs.unknown_model_ai_credits || 'false' }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@2a78d04403fdc6907d0f05327cffac9dbad5312d # v0.87.5
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Agent: Apply Review"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/agent-apply-review.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.2.14"
          GH_AW_INFO_ENGINE_ID: "opencode"
          GH_AW_SETUP_AW_CONTEXT: ${{ inputs.aw_context }}
      - name: Set runtime paths
        id: set-runtime-paths
        run: |
          if [ -z "${RUNNER_TOOL_CACHE:-}" ]; then
            echo "RUNNER_TOOL_CACHE=${{ runner.tool_cache }}" >> "$GITHUB_ENV"
          fi
          {
            echo "GH_AW_SAFE_OUTPUTS=${RUNNER_TEMP}/gh-aw/safeoutputs/outputs.jsonl"
            echo "GH_AW_SAFE_OUTPUTS_CONFIG_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/config.json"
            echo "GH_AW_SAFE_OUTPUTS_TOOLS_PATH=${RUNNER_TEMP}/gh-aw/safeoutputs/tools.json"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create gh-aw temp directory
        run: bash "${RUNNER_TEMP}/gh-aw/actions/create_gh_aw_tmp_dir.sh"
      - name: Configure gh CLI for GitHub Enterprise
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_gh_for_ghe.sh"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download activation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.activation.outputs.artifact_prefix }}activation
          path: /tmp/gh-aw
      - name: Load the issue context
        uses: ./.github/actions/load-issue-context
        with:
          issue-number: ${{ needs.subject.outputs.issue }}
          output-path: ${{ env.ISSUE_CONTEXT_PATH }}
          token: ${{ github.token }}
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr-number }}
          REPO: ${{ github.repository }}
        name: Fetch the whole review conversation and the diff
        run: "set -euo pipefail\nmkdir -p /tmp/gh-aw/agent\ngh pr diff \"$PR\" --repo \"$REPO\" > /tmp/gh-aw/agent/diff.patch\ngh api \"repos/$REPO/pulls/$PR/comments\" --paginate \\\n  --jq '[.[] | {id, path, line, author: .user.login, body, in_reply_to_id}]' \\\n  > /tmp/gh-aw/agent/review-comments.json\ngh api \"repos/$REPO/issues/$PR/comments\" --paginate \\\n  --jq '[.[] | {author: .user.login, body}]' \\\n  > /tmp/gh-aw/agent/conversation.json\ngh api graphql -f query='\n  query($owner:String!, $name:String!, $number:Int!) {\n    repository(owner:$owner, name:$name) {\n      pullRequest(number:$number) {\n            reviewThreads(first:100) {\n            nodes { id\n            isResolved isOutdated path\n            comments(first:50) { nodes { author { login } body } }\n          }\n        }\n      }\n    }\n  }' \\\n  -f owner=\"${REPO%/*}\" -f name=\"${REPO#*/}\" -F number=\"$PR\" \\\n  --jq '.data.repository.pullRequest.reviewThreads.nodes' \\\n  > /tmp/gh-aw/agent/review-threads.json"

      - name: Configure Git credentials
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "${RUNNER_TEMP}/gh-aw/actions/configure_git_credentials.sh"
      - name: Checkout PR branch
        id: checkout-pr
        if: |
          github.event.pull_request || github.event.issue.pull_request || github.event_name == 'workflow_dispatch' && fromJSON(github.event.inputs.aw_context || '{}').item_type == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN || secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'checkout_pr_branch.cjs'));
            await main();
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install AWF binary
        run: bash "${RUNNER_TEMP}/gh-aw/actions/install_awf_binary.sh" v0.28.7 --rootless
      - name: Install OpenCode CLI
        run: opencode --version 2>/dev/null | grep -qF '1.18.23' || flock /tmp/opencode-install.lock sh -c 'npm install --ignore-scripts -g opencode-ai@1.18.23 && cd "$(npm root -g)/opencode-ai" && node postinstall.mjs' # opencode-ai@1.18.23
        env:
          NPM_CONFIG_MIN_RELEASE_AGE: '1'
      - name: Verify OpenCode CLI installation
        run: opencode --version
      - name: Determine automatic lockdown mode for GitHub MCP Server
        id: determine-automatic-lockdown
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (source v9)
        env:
          GH_AW_GITHUB_TOKEN: ${{ secrets.GH_AW_GITHUB_TOKEN }}
          GH_AW_GITHUB_MCP_SERVER_TOKEN: ${{ secrets.GH_AW_GITHUB_MCP_SERVER_TOKEN }}
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const determineAutomaticLockdown = require(path.join(actionsDir, 'determine_automatic_lockdown.cjs'));
            await determineAutomaticLockdown(github, context, core);
      - name: Restore agent config folders from base branch
        if: steps.checkout-pr.outcome == 'success'
        env:
          GH_AW_AGENT_FOLDERS: ".agents .github .opencode"
          GH_AW_AGENT_FILES: "AGENTS.md opencode.jsonc"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_base_github_folders.sh"
      - name: Restore inline sub-agents from activation artifact
        env:
          GH_AW_SUB_AGENT_DIR: ".opencode/agents"
          GH_AW_SUB_AGENT_EXT: ".agent.md"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_sub_agents.sh"
      - name: Restore inline skills from activation artifact
        env:
          GH_AW_SKILL_DIR: ".opencode/skills"
        run: bash "${RUNNER_TEMP}/gh-aw/actions/restore_inline_skills.sh"
      - name: Create agent scratch directory
        run: mkdir -p .opencode/.tmp
      - name: Install the Docker Compose plugin
        run: |
          set -euo pipefail
          if docker compose version >/dev/null 2>&1; then
            echo "compose already present"; exit 0
          fi
          mkdir -p "$HOME/.docker/cli-plugins"
          curl -sSfL "https://github.com/docker/compose/releases/download/v2.39.2/docker-compose-linux-x86_64"         -o "$HOME/.docker/cli-plugins/docker-compose"
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
      - name: Runner preflight
        run: "set -euo pipefail\nmissing=\"\"\ndocker info >/dev/null 2>&1 || missing=\"the container daemon\"\n[ -n \"$missing\" ] || docker compose version >/dev/null 2>&1 || missing=\"the Docker Compose plugin\"\n[ -n \"$missing\" ] || command -v jq >/dev/null 2>&1 || missing=\"jq\"\n[ -n \"$missing\" ] || { mkdir -p \"$HOME/.local\" && [ -w \"$HOME/.local\" ]; } || missing=\"a writable \\$HOME/.local\"\nif [ -n \"$missing\" ]; then\n  echo \"::error::Runner preflight failed: this runner has no $missing, and every baseline step is user-space and needs it.\"\n  exit 1\nfi\nstale=\"$(docker ps -aq --filter 'name=^awf-' --filter 'name=^awmg-' 2>/dev/null || true)\"\nif [ -n \"$stale\" ]; then\n  # shellcheck disable=SC2086\n  docker rm -f $stale >/dev/null\n  echo \"Removed $(printf '%s\\n' \"$stale\" | wc -l | tr -d ' ') sandbox container(s) a previous job left behind.\"\nfi\necho \"Runner preflight passed.\"\n"
      - name: Install ripgrep
        run: "set -euo pipefail\n\nif command -v rg > /dev/null 2>&1; then\n  echo \"ripgrep already installed: $(rg --version | head -1)\"\n  exit 0\nfi\n\n# ARC runner pods have no root, so ripgrep comes from its release tarball into a\n# user-writable prefix instead of apt.\nmkdir -p \"$HOME/.local/bin\"\ncurl -sSfL https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz         | tar -xz --strip-components=1 -C \"$HOME/.local/bin\" --wildcards \"*/rg\"\necho \"$HOME/.local/bin\" >> \"$GITHUB_PATH\"\nrg --version\n"
      - name: Activate the pnpm version package.json pins
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare --activate
          pnpm --version
      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: ~/.local/share/pnpm/store
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install RTK
        run: "set -euo pipefail\n\nif command -v rtk > /dev/null 2>&1 && rtk --version 2>/dev/null | grep -q \"${RTK_VERSION}\"; then\n  echo \"RTK ${RTK_VERSION} already installed\"\n  exit 0\nfi\n\ntarball=\"$RUNNER_TEMP/rtk.tar.gz\"\ncurl -fsSL -o \"$tarball\" \\\n  \"https://github.com/rtk-ai/rtk/releases/download/v${RTK_VERSION}/rtk-x86_64-unknown-linux-musl.tar.gz\"\necho \"${RTK_SHA256}  $tarball\" | sha256sum --check --strict\n\ntar -xzf \"$tarball\" -C \"$RUNNER_TEMP\"\nmkdir -p \"$HOME/.local/bin\"\ninstall -m 0755 \"$RUNNER_TEMP/rtk\" \"$HOME/.local/bin/rtk\"\necho \"$HOME/.local/bin\" >> \"$GITHUB_PATH\"\n\nrtk --version\nrtk init -g --opencode --auto-patch\n"
      - name: Install OpenSpec CLI
        run: |
          set -euo pipefail

          if command -v openspec > /dev/null 2>&1 && openspec --version 2>/dev/null | grep -q "1.8.0"; then
            echo "openspec 1.8.0 already installed"
            exit 0
          fi

          npm install -g "@fission-ai/openspec@1.8.0"
          openspec --version
      - env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.slnx', '**/Directory.Packages.props') }}
          path: ~/.nuget/packages
          restore-keys: nuget-${{ runner.os }}-
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Merge the CI-only OpenCode provider into opencode.jsonc
        run: "set -euo pipefail\n\nCONFIG=opencode.jsonc\nFRAGMENT=opencode.ci.json\n\n[ -f \"$FRAGMENT\" ] || { echo \"::error::$FRAGMENT is missing from the checkout\"; exit 1; }\n\n# Pure JSON on purpose, not JSONC: jq cannot parse `//` comments, and a naive\n# comment-stripper would corrupt the `http://` inside the provider's api URL.\njq -e . \"$FRAGMENT\" > /dev/null \\\n  || { echo \"::error::$FRAGMENT is not valid JSON. Comments are not allowed in it.\"; exit 1; }\n\n# Despite the .jsonc name, this file is committed in this repository and is read by\n# jq below, so it must contain no comments. A single `//` line fails the merge with\n# \"Invalid numeric literal\", which names neither the file nor the reason.\nif [ -f \"$CONFIG\" ] && ! jq -e . \"$CONFIG\" > /dev/null 2>&1; then\n  echo \"::error::$CONFIG is tracked and must be comment-free JSON: jq cannot parse it.\"\n  exit 1\nfi\n\n# opencode.jsonc is untracked in most repositories, so it usually does not exist here.\n# Create it from the fragment when absent, merge when a checkout did provide one.\nif [ -f \"$CONFIG\" ]; then\n  merged=$(jq -s '.[0] * .[1]' \"$CONFIG\" \"$FRAGMENT\")\nelse\n  merged=$(jq -S . \"$FRAGMENT\")\nfi\n\nprintf '%s\\n' \"$merged\" > \"$CONFIG\"\n\n# gh-aw's own \"Write OpenCode Config\" step runs next and merges its base config with\n# `$existing * $base`. Base wins on conflicting keys, but it defines neither `model`\n# nor this provider, so both survive and `awf-proxy` is added alongside.\necho \"Wrote $CONFIG from $FRAGMENT:\"\njq -r '\"  model: \\(.model // \"unset\")\", \"  plugins: \\(.plugin // [] | join(\", \"))\", \"  providers: \\(.provider // {} | keys | join(\", \"))\"' \"$CONFIG\"\n"
      - name: Set up the Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          cache: "true"
          go-version: 1.26.0

      - name: Download container images
        run: bash "${RUNNER_TEMP}/gh-aw/actions/download_docker_images.sh" ghcr.io/github/gh-aw-firewall/agent:0.28.7@sha256:40a1e30b1b8d70642d4292485146cd5af612730d7a6a2e12706ddd13df375059 ghcr.io/github/gh-aw-firewall/api-proxy:0.28.7@sha256:4f209dd4cbc74d47a6c7379956143de293429d1b1b2fb2647776cdcbf65836a1 ghcr.io/github/gh-aw-firewall/squid:0.28.7@sha256:fb362a08d4d2f0da6c036e3f5d3b2fd87931e857fec3ca4a241cd2f2b61131f9 ghcr.io/github/gh-aw-mcpg:v0.4.10@sha256:08bb5fa417aed94b40a14e2b7b3ae457531a5f22b143a32fe58317139d9b8f42 ghcr.io/github/gh-aw-node@sha256:bac2192f6374d6262116399b34fc5e143d576f82719e90a18261cae7480f4d4e ghcr.io/github/github-mcp-server:v1.10.0@sha256:097512ddf58af80a620c177ae9cad93448f9a2a55c70ee8fde5cec6714522a8c
      - name: Prepare Safe Outputs Directories
        run: |
          mkdir -p "${RUNNER_TEMP}/gh-aw/safeoutputs"
          mkdir -p /tmp/gh-aw/safeoutputs
          mkdir -p /tmp/gh-aw/mcp-logs/safeoutputs
      - name: Generate Safe Outputs Config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_FILE_ROOT: "${{ runner.temp }}/gh-aw"
          GH_AW_FILE_CONFIG: "{\"files\":[{\"path\":\"safeoutputs/config.json\",\"content_env\":\"GH_AW_SAFE_OUTPUTS_CONFIG\"}]}"
          GH_AW_SAFE_OUTPUTS_CONFIG: "{\"add_comment\":{\"max\":1,\"target\":\"*\"},\"create_report_incomplete_issue\":{},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"push_to_pull_request_branch\":{\"check_branch_protection\":false,\"fallback_as_pull_request\":false,\"if_no_changes\":\"warn\",\"max_patch_size\":4096,\"protect_top_level_dot_folders\":true,\"protected_files\":[\"package.json\",\"bun.lockb\",\"bunfig.toml\",\"deno.json\",\"deno.jsonc\",\"deno.lock\",\"global.json\",\"NuGet.Config\",\"Directory.Packages.props\",\"mix.exs\",\"mix.lock\",\"go.mod\",\"go.sum\",\"stack.yaml\",\"stack.yaml.lock\",\"pom.xml\",\"build.gradle\",\"build.gradle.kts\",\"settings.gradle\",\"settings.gradle.kts\",\"gradle.properties\",\"package-lock.json\",\"yarn.lock\",\"pnpm-lock.yaml\",\"npm-shrinkwrap.json\",\"requirements.txt\",\"Pipfile\",\"Pipfile.lock\",\"pyproject.toml\",\"setup.py\",\"setup.cfg\",\"Gemfile\",\"Gemfile.lock\",\"uv.lock\",\"CODEOWNERS\",\"DESIGN.md\",\"README.md\",\"CONTRIBUTING.md\",\"CHANGELOG.md\",\"SECURITY.md\",\"CODE_OF_CONDUCT.md\"],\"signed_commits\":false,\"target\":\"*\"},\"report_incomplete\":{}}"
        with:
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'create_files.cjs'));
            await main();
      - name: Generate Safe Outputs Tools
        env:
          GH_AW_TOOLS_META_JSON: |
            {
              "description_suffixes": {
                "add_comment": " CONSTRAINTS: Maximum 1 comment(s) can be added. Target: *. Supports reply_to_id for discussion threading."
              },
              "repo_params": {},
              "dynamic_tools": []
            }
          GH_AW_VALIDATION_JSON: |
            {
              "add_comment": {
                "defaultMax": 1,
                "fields": {
                  "body": {
                    "required": true,
                    "type": "string",
                    "sanitize": true,
                    "maxLength": 65000
                  },
                  "comment_id": {
                    "optionalPositiveInteger": true
                  },
                  "item_number": {
                    "issueOrPRNumber": true
                  },
                  "pr": {
                    "issueOrPRNumber": true
                  },
                  "pr_number": {
                    "issueOrPRNumber": true
                  },
                  "reply_to_id": {
                    "type": "string",
                    "maxLength": 256
                  },
                  "repo": {
                    "type": "string",
                    "maxLength": 256
                  },
                  "target": {
                    "type": "string",
                    "enum": [
                      "status"
                    ]
                  },
                  "temporary_id": {
                    "type": "string",
                    "pattern": "^#?aw_[A-Za-z0-9_]{3,12}$"
                  }
