        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Agent: Apply Review"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/agent-apply-review.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.2.14"
