# A temporary experiment, not part of the loop. T219: can a GitHub App merge a pull request
# when a ruleset requires an approving review? Every auto-merge result this canary has
# produced was obtained with no protection configured, and the answer decides whether the
# path-based gating design can rely on the forge blocking a merge or only on our gate
# declining to perform one.
#
# Delete this file when the question is answered.
name: Protection probe

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request to probe
        required: true
        type: string
      operation:
        description: What to try
        required: true
        type: choice
        options:
          - state
          - approve
          - merge
          - auto
          - rules
          - open
          - trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Create bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: What the forge says about this pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          echo "── as the App ───────────────────────────────────────────"
          gh pr view "$PR" --repo "$REPO" \
            --json number,baseRefName,mergeable,mergeStateStatus,reviewDecision,isDraft
          gh api "repos/${REPO}/pulls/${PR}" --jq '{mergeable, mergeable_state, rebaseable}'

      - name: Approve as the App
        if: inputs.operation == 'approve'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          # The pull request is authored by github-actions[bot] and this token is the
          # canary App, so this is not self-approval by either identity.
          gh api --method POST "repos/${REPO}/pulls/${PR}/reviews" \
            -f event=APPROVE -f body="Probe: does an App review satisfy a required approval?" \
            --jq '{id, state, user: .user.login}'
          sleep 10
          gh pr view "$PR" --repo "$REPO" --json reviewDecision,mergeStateStatus

      - name: Ask for auto-merge as the App
        if: inputs.operation == 'auto'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          # The deferred path. The reported behaviour is that its completion does not
          # re-evaluate a bypass grant, which the synchronous endpoint does; if that is
          # true, a loop that asked for auto-merge would wait for ever under protection.
          gh pr merge "$PR" --repo "$REPO" --rebase --auto || echo "auto-merge request failed"
          for _ in 1 2 3; do
            sleep 20
            gh pr view "$PR" --repo "$REPO" --json state,mergeStateStatus,autoMergeRequest               --jq '{state, mergeStateStatus, auto: (.autoMergeRequest != null)}'
          done

      - name: Push an empty commit with the CI trigger token
        if: inputs.operation == 'trigger'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TRIGGER_TOKEN: ${{ secrets.GH_AW_CI_TRIGGER_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          [ -n "$TRIGGER_TOKEN" ] || { echo "::error::GH_AW_CI_TRIGGER_TOKEN is not set on this repository."; exit 1; }
          branch="$(gh pr view "$PR" --repo "$REPO" --json headRefName --jq .headRefName)"
          before="$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)"
          echo "PR #${PR} head ${branch} at ${before}"

          # The same thing the framework does after opening a pull request: an empty commit
          # pushed by an identity that is not GITHUB_TOKEN, because GitHub does not start
          # workflows for events that token raises.
          git clone --quiet --branch "$branch" "https://x-access-token:${TRIGGER_TOKEN}@github.com/${REPO}.git" probe-clone
          cd probe-clone
          git config user.name "ci-trigger-probe"
          git config user.email "ci-trigger-probe@users.noreply.github.com"
          git commit --quiet --allow-empty -m "probe: empty commit to start CI"
          git push --quiet origin "$branch"
          after="$(git rev-parse HEAD)"
          echo "pushed ${after}"

          # Ask again once the forge has had time to start something. A query that returns
          # nothing seconds after a push is not evidence that nothing will run.
          for attempt in 1 2 3 4 5 6; do
            sleep 20
            runs="$(gh api "repos/${REPO}/actions/runs?head_sha=${after}&per_page=20" \
              --jq '[.workflow_runs[] | {name, event, status, actor: .actor.login, triggering: .triggering_actor.login}]')"
            echo "attempt ${attempt}: ${runs}"
            [ "$runs" = "[]" ] || break
          done

      - name: Open a pull request as the App
        if: inputs.operation == 'open'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: probe-base
        run: |
          set -euo pipefail
          # Authored by the App, so a person can approve it: GitHub refuses to let anyone
          # approve their own pull request, and the human review is the point of this probe.
          branch="probe-auto-${GITHUB_RUN_ID}"
          sha="$(gh api "repos/${REPO}/git/ref/heads/${BASE}" --jq .object.sha)"
          gh api --method POST "repos/${REPO}/git/refs" -f ref="refs/heads/${branch}" -f sha="$sha" --jq .ref
          # base64 of "auto\n", written out rather than piped: an escape in a heredoc
          # arrives changed often enough that this package has a rule about it.
          gh api --method PUT "repos/${REPO}/contents/PROBE-AUTO.txt" -f message="probe: a change for the auto-merge chain" -f content="YXV0bwo=" -f branch="$branch" --jq .commit.sha
          gh pr create --repo "$REPO" --base "$BASE" --head "$branch" --title "T219 probe: auto-merge waits for a human review" --body "Temporary. Arms auto-merge as the App under a ruleset requiring one review, then waits for a person."

      - name: Which rules does the forge say apply, as the App
        if: inputs.operation == 'rules'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="$(gh pr view "$PR" --repo "$REPO" --json baseRefName --jq .baseRefName)"
          # The question: is there a caller-aware signal at all? If this endpoint drops a
          # rule the caller may bypass, the gate can keep asking before it acts. If it
          # lists the rule either way, the only honest signal is the attempt itself.
          echo "-- rules on ${base}, as the App --"
          gh api "repos/${REPO}/rules/branches/${base}" --jq '[.[] | {type, ruleset: .ruleset_id}]'
          echo "-- the same, as the workflow token --"
          GH_TOKEN="$WORKFLOW_TOKEN" gh api "repos/${REPO}/rules/branches/${base}" --jq '[.[] | {type, ruleset: .ruleset_id}]'

      - name: Merge as the App, synchronously
        if: inputs.operation == 'merge'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          # The synchronous endpoint, which is what `gh pr merge` without `--auto` calls.
          # The distinction matters: the reported behaviour is that auto-merge's deferred
          # completion does not re-evaluate a bypass grant, and this path does.
          status=0
          body="$(gh api --method PUT "repos/${REPO}/pulls/${PR}/merge" \
            -f merge_method=rebase -i 2>&1)" || status=$?
          printf '%s\n' "$body"
          echo "exit=${status}"
